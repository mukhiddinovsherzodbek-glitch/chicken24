<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0F1115">
  <!-- Xavfsizlik: skriptlar faqat o'zimizdan va telegram.org dan; tashqi so'rov faqat bot serveriga (config.js API_BASE) -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://chicken24-bot.onrender.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>Chicken24</title>
  <link rel="icon" href="images/logo-192.webp" type="image/webp">
  <!-- chicken24.uz (sayt) ochilsa /site/ ga o'tkazadi; Mini App (pages.dev) ga ta'sir qilmaydi -->
  <script src="host-redirect.js"></script>
  <!-- Telegram WebApp SDK boshqa skriptlardan oldin yuklanishi kerak -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- ?v=N: Telegram eski keshni ko'rsatmasligi uchun; har o'zgarishda raqamni oshiring -->
  <link rel="stylesheet" href="style.css?v=17">
  <!-- Interfeys matnlari (uz/ru) va bot natijasini qo'llash - app.js dan oldin -->
  <script src="i18n.js?v=17" defer></script>
  <script src="config.js?v=17" defer></script>
  <script src="result.js?v=17" defer></script>
  <script src="app.js?v=17" defer></script>
</head>
<body>
  <div id="app" class="app">
    <!-- Sarlavha va bo'lim yorliqlari birga yopishqoq (sticky) -->
    <div class="appbar">
    <header class="topbar" id="topbar">
      <button id="backBtn" class="icon-btn topbar-back" type="button" data-action="back" aria-label="Orqaga" data-i18n-aria="back" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="brand" id="brand">
        <img class="brand-logo" src="images/logo-192.webp"
             srcset="images/logo-192.webp 1x, images/logo-384.webp 2x"
             alt="Chicken24" width="40" height="40" decoding="async">
        <span class="brand-name">Chicken<span class="accent">24</span></span>
      </div>
      <h1 class="topbar-title" id="topbarTitle" hidden></h1>
    </header>
    <!-- Matnlar app.js da tanlangan tilga almashtiriladi (data-i18n); bu yerdagisi - JS yuklanguncha -->
    <nav class="tabs" role="tablist" aria-label="Bo'limlar" data-i18n-aria="tabs.aria">
      <button id="tabMenu" class="tab active" type="button" role="tab" aria-selected="true" data-action="tab-menu" data-i18n="tab.menu">Menu</button>
      <button id="tabOrders" class="tab" type="button" role="tab" aria-selected="false" data-action="tab-orders" data-i18n="tab.orders">Buyurtmalarim</button>
    </nav>
    </div>

    <!-- Yopiq vaqtda ko'rinadi (app.js -> updateHoursBanner) -->
    <div id="hoursBanner" class="hours-banner" role="status" hidden></div>

    <main id="view" class="view" tabindex="-1">
      <div class="loader" aria-label="Yuklanmoqda" data-i18n-aria="loading"><span></span><span></span><span></span></div>
    </main>
  </div>

  <!-- Pastdan chiquvchi savat tugmasi -->
  <div id="cartBar" class="cart-bar" aria-hidden="true">
    <button id="cartBarBtn" class="cart-bar-btn" type="button" data-action="open-cart" tabindex="-1">
      <span class="cart-bar-icon" aria-hidden="true">🛒</span>
      <span class="cart-bar-text" data-i18n="cartbar.go">Savatga o'tish</span>
      <span class="cart-bar-total">(<span data-i18n="cartbar.total">Jami</span>: <b id="cartBarTotal"></b>)</span>
    </button>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Ilova ishlashi uchun JavaScript yoqilgan bo'lishi kerak. / Для работы приложения включите JavaScript.</p></noscript>
</body>
</html>
